name: ANNY Source Inventory
on:
  push:
    branches: [main]
    paths:
      - "primary-anny/Anny/src/**"
      - "reference-anny/src/**"
      - "scripts/compare_source_inventory.py"
      - "scripts/test_compare_source_inventory.py"
      - ".github/workflows/source-inventory.yml"
  pull_request:
    paths:
      - "primary-anny/Anny/src/**"
      - "reference-anny/src/**"
      - "scripts/compare_source_inventory.py"
      - "scripts/test_compare_source_inventory.py"
      - ".github/workflows/source-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit test inventory tool
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Generate comparison
        run: python scripts/compare_source_inventory.py --format markdown --output /tmp/anny-source-inventory.md
      - name: Print report
        run: cat /tmp/anny-source-inventory.md
