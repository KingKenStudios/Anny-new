name: ANNY Primary Application CI

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - "src/**"
      - "primary-anny/**"
      - ".github/workflows/anny-primary-ci.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - "src/**"
      - "primary-anny/**"
      - ".github/workflows/anny-primary-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anny-primary-ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Node 22 npm install, unit tests, type-check, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install root workspace dependencies
        run: npm ci

      - name: Run unit, vision, creative, auth, storage, and upload policy tests
        run: npm test

      - name: TypeScript type-check
        run: npm run lint

      - name: Production build (frontend + server bundle)
        run: npm run build

  storage-integration:
    name: Live S3-compatible object storage integration test (SeaweedFS)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start pinned SeaweedFS S3-compatible container
        run: |
          mkdir -p /tmp/seaweedfs
          cat <<'EOF' > /tmp/seaweedfs/s3.json
          {
            "identities": [
              {
                "name": "anny-ci",
                "credentials": [
                  {
                    "accessKey": "annyciaccesskey",
                    "secretKey": "annycisecretkey_strong_2026"
                  }
                ],
                "actions": ["Admin", "Read", "Write", "List", "Tagging"]
              }
            ]
          }
          EOF
          docker run -d --name anny-s3-ci \
            -p 8333:8333 \
            -p 9333:9333 \
            -v /tmp/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro \
            chrislusf/seaweedfs:3.68 \
            server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9333/cluster/status >/dev/null 2>&1 && (echo > /dev/tcp/127.0.0.1/8333) 2>/dev/null; then
              echo "SeaweedFS S3 gateway is healthy and ready on port 8333."
              exit 0
            fi
            sleep 1
          done
          docker logs anny-s3-ci
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Run live S3 storage integration suite
        env:
          MINIO_ENDPOINT: http://127.0.0.1:8333
          MINIO_ACCESS_KEY: annyciaccesskey
          MINIO_SECRET_KEY: annycisecretkey_strong_2026
          MINIO_BUCKET: anny-ci-artifacts
          MINIO_USE_SSL: "false"
        run: npm run test:storage

      - name: Stop S3 container
        if: always()
        run: docker rm -f anny-s3-ci || true
