name: ANNY Dependency Remediation Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install dependencies (npm only, no broken stream-json override)
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: TypeScript type-check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Capture npm audit report
        run: npm audit --json > npm-audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: anny-npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: warn
